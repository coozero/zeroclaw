name: Build ZeroClaw for iOS ARM64

on:
  workflow_dispatch:
  push:
    branches: [ ios-build ]

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      
      - name: Build for aarch64-apple-ios
        run: cargo build --release --target aarch64-apple-ios
      
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-aarch64-apple-ios
          path: target/aarch64-apple-ios/release/zeroclaw